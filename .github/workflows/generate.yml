name: generate

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Video topic (empty = auto-pick from topics.txt)"
        required: false
        default: ""
      language:
        description: "Script language code"
        required: false
        default: "en-US"
      voice:
        description: "edge-tts voice"
        required: false
        default: "en-US-AriaNeural"
      llm_model:
        description: "Ollama model for script + material terms"
        required: false
        default: "qwen2.5:3b"
      stop_at:
        description: "Stop after stage (script|terms|audio|subtitle|materials|video)"
        required: false
        default: "video"
      material_queries:
        description: "Comma-separated stock footage search terms (Mixkit, key-free). Empty = use the subject."
        required: false
        default: ""
      privacy:
        description: "YouTube privacy if upload enabled (cron runs always upload public)"
        required: false
        default: "private"
      mpt_commit:
        description: "MoneyPrinterTurbo commit (pinned)"
        required: false
        default: "ce289ffb61a118779c56d6b4a34181905dbed2b9"
  schedule:
    # Daily 13:30 UTC = 7:00 PM IST
    - cron: "30 13 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Clone MoneyPrinterTurbo (pinned)
        run: |
          mkdir MoneyPrinterTurbo
          cd MoneyPrinterTurbo
          git init -q
          git remote add origin https://github.com/harry0703/MoneyPrinterTurbo.git
          git fetch -q --depth 1 origin "${{ inputs.mpt_commit }}"
          git checkout -q FETCH_HEAD

      - name: Install Python dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          # requirements-security.txt (pillow>=13) conflicts with moviepy's pillow<12 cap.
          # Upstream marks it optional (uv --overrides); plain requirements.txt resolves fine.
          pip install -r requirements.txt

      - name: Install Ollama and pull the script model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull "${{ inputs.llm_model }}"

      - name: Pick topic
        run: |
          SUBJECT="${{ inputs.subject }}"
          if [ -z "$SUBJECT" ]; then
            N=$(wc -l < topics.txt)
            SUBJECT=$(sed -n "$(( (10#$(date -u +%j) % N) + 1 ))p" topics.txt)
          fi
          echo "SUBJECT=$SUBJECT" >> "$GITHUB_ENV"
          echo "topic: $SUBJECT"

      - name: Configure MoneyPrinterTurbo
        working-directory: MoneyPrinterTurbo
        run: |
          cp config.example.toml config.toml
          sed -i 's/^llm_provider = .*/llm_provider = "ollama"/' config.toml
          sed -i 's/^ollama_model_name = .*/ollama_model_name = "${{ inputs.llm_model }}"/' config.toml
          sed -i 's/^video_source = .*/video_source = "local"/' config.toml

      - name: Scrape stock footage (key-free, Mixkit)
        if: inputs.stop_at == 'video'
        run: |
          QUERIES="${{ inputs.material_queries }}"
          if [ -z "$QUERIES" ]; then QUERIES="$SUBJECT"; fi
          python scripts/scrape_materials.py --queries "$QUERIES" --count 5 --outdir materials
          MATS=$(ls "$PWD"/materials/*.mp4 | paste -sd,)
          echo "MATS=$MATS" >> "$GITHUB_ENV"

      - name: Generate the short
        working-directory: MoneyPrinterTurbo
        run: |
          if [ "${{ inputs.stop_at }}" = "video" ]; then
            SOURCE_ARGS="--video-source local --video-materials $MATS"
          else
            SOURCE_ARGS="--video-source local"
          fi
          python cli.py \
            --video-subject "$SUBJECT" \
            --video-language "${{ inputs.language }}" \
            --voice-name "${{ inputs.voice }}" \
            $SOURCE_ARGS \
            --video-aspect 9:16 \
            --stop-at "${{ inputs.stop_at }}" \
            --task-id 11111111-1111-4111-8111-111111111111

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-output-${{ github.run_id }}
          path: MoneyPrinterTurbo/storage/tasks/
          if-no-files-found: warn

      # YouTube upload: inactive until repo variable YOUTUBE_UPLOAD_ENABLED=true
      # and secrets YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN are set.
      # Manual dispatches upload private (smoke test); daily cron uploads public.
      - name: Install YouTube upload dependencies
        if: vars.YOUTUBE_UPLOAD_ENABLED == 'true' && inputs.stop_at == 'video'
        run: pip install google-api-python-client google-auth

      - name: Upload to YouTube
        if: vars.YOUTUBE_UPLOAD_ENABLED == 'true' && inputs.stop_at == 'video'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          VIDEO=$(ls MoneyPrinterTurbo/storage/tasks/*/final-*.mp4 | head -1)
          TITLE=$(echo "$SUBJECT" | cut -c1-90)
          python scripts/youtube_upload.py \
            --file "$VIDEO" \
            --title "$TITLE #Shorts" \
            --description "$SUBJECT. New short every day. #Shorts #facts #animals" \
            --tags "facts,shorts,animals" \
            --privacy "$PRIVACY"
