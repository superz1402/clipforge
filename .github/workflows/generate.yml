name: generate

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Video topic (empty = auto-pick from topics.txt)"
        required: false
        default: ""
      language:
        description: "Script language code"
        required: false
        default: "en-US"
      voice:
        description: "edge-tts voice"
        required: false
        default: "en-US-BrianMultilingualNeural"
      llm_model:
        description: "Ollama model for script + material terms"
        required: false
        default: "qwen2.5:3b"
      stop_at:
        description: "Stop after stage (script|terms|audio|subtitle|materials|video)"
        required: false
        default: "video"
      material_queries:
        description: "Comma-separated stock footage search terms (Mixkit, key-free). Empty = per-beat plan from the local LLM."
        required: false
        default: ""
      privacy:
        description: "YouTube privacy if upload enabled (cron runs always upload public)"
        required: false
        default: "private"
      mpt_commit:
        description: "MoneyPrinterTurbo commit (pinned)"
        required: false
        default: "ce289ffb61a118779c56d6b4a34181905dbed2b9"
  schedule:
    # Daily 13:30 UTC = 7:00 PM IST
    - cron: "30 13 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core

      - name: Clone MoneyPrinterTurbo (pinned)
        run: |
          mkdir MoneyPrinterTurbo
          cd MoneyPrinterTurbo
          git init -q
          git remote add origin https://github.com/harry0703/MoneyPrinterTurbo.git
          git fetch -q --depth 1 origin "${{ inputs.mpt_commit }}"
          git checkout -q FETCH_HEAD

      - name: Install Python dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          # requirements-security.txt (pillow>=13) conflicts with moviepy's pillow<12 cap.
          # Upstream marks it optional (uv --overrides); plain requirements.txt resolves fine.
          pip install -r requirements.txt

      - name: Install Ollama and pull the script model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull "${{ inputs.llm_model }}"

      - name: Pick topic
        run: |
          SUBJECT="${{ inputs.subject }}"
          if [ -z "$SUBJECT" ]; then
            N=$(wc -l < topics.txt)
            SUBJECT=$(sed -n "$(( (10#$(date -u +%j) % N) + 1 ))p" topics.txt)
          fi
          echo "SUBJECT=$SUBJECT" >> "$GITHUB_ENV"
          echo "topic: $SUBJECT"

      - name: Plan script + per-beat footage (local LLM)
        if: inputs.stop_at == 'video' && inputs.material_queries == ''
        run: |
          if python scripts/plan_video.py --subject "$SUBJECT" --model "${{ inputs.llm_model }}" --outdir plan; then
            echo "PLANNED=yes" >> "$GITHUB_ENV"
          else
            echo "PLANNED=no" >> "$GITHUB_ENV"
          fi

      - name: Scrape stock footage per beat (key-free, Mixkit)
        if: inputs.stop_at == 'video' && env.PLANNED == 'yes'
        run: |
          i=0
          while IFS= read -r phrase; do
            [ -z "$phrase" ] && continue
            i=$((i+1))
            python scripts/scrape_materials.py --queries "$phrase,${phrase%% *}" --count 1 --outdir materials --prefix "$(printf '%02d' "$i")-" || true
          done < plan/phrases.txt
          MATS=$(ls "$PWD"/materials/*.mp4 2>/dev/null | sort | paste -sd,)
          if [ -z "$MATS" ]; then echo "no materials scraped"; exit 1; fi
          echo "MATS=$MATS" >> "$GITHUB_ENV"

      - name: Scrape stock footage (fallback, subject-based)
        if: inputs.stop_at == 'video' && env.PLANNED != 'yes'
        run: |
          QUERIES="${{ inputs.material_queries }}"
          if [ -z "$QUERIES" ]; then
            QUERIES=$(python3 -c 'import re,sys; stop=set("why how what are is the of to in and a an do does your you can that this it its on for with about their they".split()); words=[w for w in re.sub(r"[^a-z ]"," ",sys.argv[1].lower()).split() if w not in stop]; out=[]; [out.extend([w] + ([w[:-2]] if re.search(r"(ses|xes|ches|shes|zes)$", w) else [w[:-1]] if w.endswith("s") and len(w)>3 else [])) for w in words]; print(",".join(dict.fromkeys(out)))' "$SUBJECT")
          fi
          python scripts/scrape_materials.py --queries "$QUERIES" --count 5 --outdir materials
          MATS=$(ls "$PWD"/materials/*.mp4 | sort | paste -sd,)
          echo "MATS=$MATS" >> "$GITHUB_ENV"

      - name: Configure MoneyPrinterTurbo
        working-directory: MoneyPrinterTurbo
        run: |
          cp config.example.toml config.toml
          sed -i 's/^llm_provider = .*/llm_provider = "ollama"/' config.toml
          sed -i 's/^ollama_model_name = .*/ollama_model_name = "${{ inputs.llm_model }}"/' config.toml
          sed -i 's/^video_source = .*/video_source = "local"/' config.toml
          # Engagement: sequential footage matching the narration beats, quick cuts
          sed -i -E 's|^#? *video_concat_mode = .*|video_concat_mode = "sequential"|' config.toml
          sed -i -E 's|^#? *video_clip_duration = .*|video_clip_duration = 3|' config.toml
          # Captions: SupoClip-style single-word pop, bold, thick outline
          sed -i -E 's|^#? *subtitle_display_mode = .*|subtitle_display_mode = "word_by_word"|' config.toml
          sed -i -E 's|^#? *subtitle_animation = .*|subtitle_animation = "pop_spring"|' config.toml
          sed -i -E 's|^#? *font_name = .*|font_name = "BeVietnamPro-Bold.ttf"|' config.toml
          sed -i -E 's|^#? *font_size = .*|font_size = 90|' config.toml
          sed -i -E 's|^#? *stroke_width = .*|stroke_width = 4|' config.toml
          sed -i -E 's|^#? *subtitle_position = .*|subtitle_position = "two_thirds_bottom"|' config.toml

      - name: Generate the short
        working-directory: MoneyPrinterTurbo
        run: |
          ARGS=(--video-subject "$SUBJECT"
                --video-language "${{ inputs.language }}"
                --voice-name "${{ inputs.voice }}")
          if [ "$PLANNED" = "yes" ] && [ -f ../plan/script.txt ]; then
            ARGS+=(--video-script "$(cat ../plan/script.txt)")
          fi
          if [ "${{ inputs.stop_at }}" = "video" ]; then
            ARGS+=(--video-source local --video-materials "$MATS")
          else
            ARGS+=(--video-source local)
          fi
          ARGS+=(--video-aspect 9:16 --stop-at "${{ inputs.stop_at }}"
                 --task-id 11111111-1111-4111-8111-111111111111)
          python cli.py "${ARGS[@]}"

      - name: Burn hook-title overlay
        if: inputs.stop_at == 'video'
        run: |
          TASKDIR=MoneyPrinterTurbo/storage/tasks/11111111-1111-4111-8111-111111111111
          HOOK_TEXT=""
          if [ "$PLANNED" = "yes" ] && [ -f plan/beats.txt ]; then HOOK_TEXT=$(head -1 plan/beats.txt); fi
          if [ -n "$HOOK_TEXT" ]; then
            python scripts/hook_overlay.py --video "$TASKDIR/final-1.mp4" --srt "$TASKDIR/subtitle.srt" --out "$TASKDIR/final-1-hook.mp4" --text "$HOOK_TEXT"
          else
            python scripts/hook_overlay.py --video "$TASKDIR/final-1.mp4" --srt "$TASKDIR/subtitle.srt" --out "$TASKDIR/final-1-hook.mp4"
          fi
          if [ -f "$TASKDIR/final-1-hook.mp4" ]; then
            mv "$TASKDIR/final-1-hook.mp4" "$TASKDIR/final-1.mp4"
          else
            echo "hook overlay unavailable, keeping original"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-output-${{ github.run_id }}
          path: MoneyPrinterTurbo/storage/tasks/
          if-no-files-found: warn

      # YouTube upload: inactive until repo variable YOUTUBE_UPLOAD_ENABLED=true
      # and secrets YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN are set.
      # Manual dispatches upload private (smoke test); daily cron uploads public.
      - name: Install YouTube upload dependencies
        if: vars.YOUTUBE_UPLOAD_ENABLED == 'true' && inputs.stop_at == 'video'
        run: pip install google-api-python-client google-auth

      - name: Upload to YouTube
        if: vars.YOUTUBE_UPLOAD_ENABLED == 'true' && inputs.stop_at == 'video'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy || 'public' }}
        run: |
          VIDEO=$(ls MoneyPrinterTurbo/storage/tasks/*/final-*.mp4 | head -1)
          TITLE=$(echo "$SUBJECT" | cut -c1-90)
          python scripts/youtube_upload.py \
            --file "$VIDEO" \
            --title "$TITLE #Shorts" \
            --description "$SUBJECT. New short every day. #Shorts #facts #animals" \
            --tags "facts,shorts,animals" \
            --privacy "$PRIVACY"
