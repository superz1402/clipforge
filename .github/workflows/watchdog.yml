name: Cron watchdog
on:
  schedule:
    # 20 min after the daily generate cron (13:30 UTC = 7:00 PM IST)
    - cron: "50 13 * * *"
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch generate.yml if the cron did not start
        env:
          GH_PAT: ${{ secrets.WATCHDOG_PAT }}
        run: |
          # any generate.yml run created in the last 40 minutes?
          SINCE=$(date -u -d "40 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          RUNS=$(curl -sf -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate.yml/runs?created=>$SINCE" \
            | jq '.workflow_runs | length')
          echo "recent generate runs: $RUNS"
          if [ "$RUNS" = "0" ]; then
            echo "cron missed - dispatching generate.yml"
            curl -sf -X POST -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/generate.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "dispatched"
          else
            echo "cron fired normally - nothing to do"
          fi
